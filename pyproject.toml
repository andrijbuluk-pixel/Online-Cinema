[tool.poetry]
name = "online-cinema"
version = "0.1.0"
description = "Online Cinema API"
authors = ["Andriy <andrijbuluk@gmail.com>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.30"
alembic = "^1.13.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.0.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
flake8 = "^7.0.0"
black = "^24.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
